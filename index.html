<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millionaire M — Letras &amp; Traduções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wordmark">
    <svg class="laurel" viewBox="0 0 120 40" aria-hidden="true">
      <g class="laurel-left">
        <path d="M58 20 C48 18, 40 12, 34 4" />
        <path d="M58 20 C46 20, 36 16, 28 10" />
        <path d="M58 20 C46 24, 34 22, 22 18" />
        <path d="M58 20 C48 26, 38 28, 26 28" />
      </g>
      <g class="laurel-right">
        <path d="M62 20 C72 18, 80 12, 86 4" />
        <path d="M62 20 C74 20, 84 16, 92 10" />
        <path d="M62 20 C74 24, 86 22, 98 18" />
        <path d="M62 20 C72 26, 82 28, 94 28" />
      </g>
    </svg>
    <h1>Millionaire M</h1>
  </div>
  <p class="tagline">letras em inglês &amp; tradução, linha a linha</p>
</header>

<main>
  <div class="search-wrap">
    <input
      type="search"
      id="song-search"
      class="search-input"
      placeholder="Procurar música…"
      autocomplete="off"
      aria-label="Procurar música"
    >
  </div>

  <section id="song-list" class="song-list" aria-live="polite">
    <p class="loading">carregando músicas…</p>
  </section>
</main>

<footer class="site-footer">
  <p>feito para estudar inglês através das músicas favoritas ✦</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
