<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millionaire M — Letra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="song-header">
  <a class="back-link" href="index.html">← todas as músicas</a>
  <h1 id="song-title">carregando…</h1>
  <p class="legend"><span class="dot dot-en"></span> inglês &nbsp;&nbsp; <span class="dot dot-pt"></span> tradução</p>
</header>

<main>
  <div id="lyrics" class="lyrics" aria-live="polite"></div>
</main>

<div class="scroll-bar" id="scroll-bar">
  <button id="scroll-restart" class="scroll-btn" title="Voltar ao topo">⤒</button>
  <button id="scroll-toggle" class="scroll-btn scroll-btn-play" title="Tocar rolagem automática">▶</button>
  <input
    type="text"
    id="scroll-duration"
    class="scroll-duration"
    value="3:30"
    inputmode="numeric"
    aria-label="Tempo restante da música (min:seg)"
    title="Tempo restante da música (min:seg)"
  >
  <button id="scroll-slower" class="scroll-btn" title="Mais devagar">−</button>
  <button id="scroll-faster" class="scroll-btn" title="Mais rápido">+</button>
</div>

<footer class="site-footer">
  <a class="back-link" href="index.html">← voltar para todas as músicas</a>
</footer>

<script src="js/song.js"></script>
</body>
</html>
